name: Deploy redis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-redis.yml
      - redis/**
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2

      - name: Deploy fpcache to dev-fss
        uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: redis/fpcache-redis.yaml
          PRINT_PAYLOAD: true

      - name: Deploy to fpcache to prod-fss
        if: success()
        uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-fss
          RESOURCE: redis/fpcache-redis.yaml
          PRINT_PAYLOAD: true

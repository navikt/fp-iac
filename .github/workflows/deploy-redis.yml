name: Deploy redis

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-redis.yml
      - redis/**
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Deploy fpcache to dev-fss
        uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: redis/fpcache-redis.yaml
          PRINT_PAYLOAD: true

      - name: Deploy to fpcache to prod-fss
        if: success()
        uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-fss
          RESOURCE: redis/fpcache-redis.yaml
          PRINT_PAYLOAD: true

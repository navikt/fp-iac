name: Deploy redirects

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-redirect.yml
      - redirect/**
jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Deploy redirect familie to prod
        uses: nais/deploy/actions/deploy@fc3eae3edebabdf67f7592102ae16176d5ba3b5f # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: redirect/redirect-familie.yml
          PRINT_PAYLOAD: true

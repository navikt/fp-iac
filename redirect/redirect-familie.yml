apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: familie-haproxy-redirect
  namespace: teamforeldrepenger
  labels:
    team: teamforeldrepenger
  annotations:
    haproxy.org/request-redirect: "https://www.nav.no/barn"
    haproxy.org/request-redirect-code: "301"
spec:
  ingressClassName: external-haproxy
  rules:
    - host: familie.nav.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: familie-redirect-til-barn
                port:
                  number: 80
